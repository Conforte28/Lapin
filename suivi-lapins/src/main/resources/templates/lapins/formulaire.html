<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modeEdition} ? 'Modifier un lapin' : 'Ajouter un lapin')}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="contenu-principal">
        <div class="entete-page">
            <div>
                <h1 th:text="${modeEdition} ? 'Modifier la fiche du lapin' : 'Ajouter un lapin'">Lapin</h1>
                <div class="sous-titre">Les statuts vendu et mort se gèrent uniquement via les sorties</div>
            </div>
            <a th:href="@{/lapins}" class="btn btn-secondaire">Retour à la liste</a>
        </div>

        <div th:if="${erreur}" class="message-erreur" th:text="${erreur}"></div>

        <div class="carte">
            <form th:action="${modeEdition} ? @{/lapins/{id}/modifier(id=${lapin.id})} : @{/lapins}"
                  method="post">
                <div class="formulaire-grille">
                    <div class="champ">
                        <label for="code">Code unique</label>
                        <input type="text" id="code" name="code" th:value="${lapin.code}" required maxlength="50">
                    </div>

                    <div class="champ">
                        <label for="sexe">Sexe</label>
                        <select id="sexe" name="sexe" required>
                            <option th:each="s : ${sexes}"
                                    th:value="${s}"
                                    th:text="${s.libelle}"
                                    th:selected="${lapin.sexe == s}"></option>
                        </select>
                    </div>

                    <div class="champ">
                        <label for="race">Race ou type</label>
                        <input type="text" id="race" name="race" th:value="${lapin.race}" maxlength="100">
                    </div>

                    <div class="champ">
                        <label for="dateNaissance">Date de naissance</label>
                        <input type="date" id="dateNaissance" name="dateNaissance"
                               th:max="${aujourdHui}"
                               th:value="${lapin.dateNaissance != null ? #temporals.format(lapin.dateNaissance, 'yyyy-MM-dd') : ''}">
                    </div>

                    <div class="champ">
                        <label for="clapier">Clapier ou emplacement</label>
                        <input type="text" id="clapier" name="clapier" th:value="${lapin.clapier}" maxlength="100">
                    </div>

                    <div class="champ">
                        <label for="poidsKg">Poids en kg</label>
                        <input type="number" id="poidsKg" name="poidsKg" step="0.01" min="0.01"
                               th:value="${lapin.poidsKg}">
                    </div>

                    <div class="champ" th:if="${modeEdition}">
                        <label for="statutLecture">Statut actuel</label>
                        <input type="text" id="statutLecture" th:value="${lapin.statut.libelle}" readonly>
                    </div>
                </div>

                <div class="actions-ligne" style="margin-top: 16px;">
                    <button type="submit" class="btn btn-primaire"
                            th:text="${modeEdition} ? 'Enregistrer les modifications' : 'Enregistrer le lapin'">
                        Enregistrer
                    </button>
                    <a th:href="@{/lapins}" class="btn btn-secondaire">Annuler</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
