<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tableau de bord')}"></head>
<body>
<div class="app-layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="contenu-principal">
        <div class="entete-page">
            <div class="entete-page-visuel">
                <img th:src="@{/images/lapin-roux.jpg}" alt="Lapin" class="miniature-entete">
                <div>
                    <h1>Tableau de bord</h1>
                    <div class="sous-titre" th:text="${#strings.capitalize(indicateurs.moisLibelle)}">mois</div>
                </div>
            </div>
        </div>

        <div class="grille-indicateurs">
            <div class="carte-indicateur">
                <div class="libelle">Lapins vivants</div>
                <div class="valeur" th:text="${indicateurs.lapinsVivants}">0</div>
            </div>

            <div class="carte-indicateur">
                <div class="libelle">Lapereaux nés vivants</div>
                <div class="valeur" th:text="${indicateurs.nesVivantsMois}">0</div>
            </div>

            <div class="carte-indicateur">
                <div class="libelle">Décès enregistrés</div>
                <div class="valeur" th:text="${indicateurs.decesMois}">0</div>
            </div>

            <div class="carte-indicateur">
                <div class="libelle">Ventes du mois</div>
                <div class="valeur"
                     th:text="${#numbers.formatDecimal(indicateurs.ventesMois, 1, 'WHITESPACE', 0, 'COMMA')} + ' FCFA'">
                    0 FCFA
                </div>
            </div>

            <div class="carte-indicateur">
                <div class="libelle">Dépenses du mois</div>
                <div class="valeur"
                     th:text="${#numbers.formatDecimal(indicateurs.depensesMois, 1, 'WHITESPACE', 0, 'COMMA')} + ' FCFA'">
                    0 FCFA
                </div>
            </div>

            <div class="carte-indicateur">
                <div class="libelle">Solde simple : ventes moins dépenses</div>
                <div class="valeur"
                     th:text="${#numbers.formatDecimal(indicateurs.soldeMois, 1, 'WHITESPACE', 0, 'COMMA')} + ' FCFA'">
                    0 FCFA
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
