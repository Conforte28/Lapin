<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erreur')}"></head>
<body>
<div class="page-erreur-centre">
    <div class="carte-connexion">
        <h1>Une erreur est survenue</h1>
        <p class="sous-titre">
            L'opération demandée n'a pas pu être effectuée.
        </p>
        <p th:if="${status != null}" style="margin-bottom: 16px;">
            Code : <strong th:text="${status}"></strong>
        </p>
        <a th:href="@{/dashboard}" class="btn btn-primaire" style="width: 100%;">
            Retour au tableau de bord
        </a>
    </div>
</div>
</body>
</html>
