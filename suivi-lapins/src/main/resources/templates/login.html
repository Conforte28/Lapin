<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
<div class="connexion-layout">
    <aside class="connexion-sidebar">
        <div class="connexion-entete">
            <img th:src="@{/images/logo.jpg}" alt="Logo AZWI" class="marque-logo">
            <div>
                <div class="connexion-marque">AZWI</div>
                <div class="connexion-sous-marque">Suivi de production de lapins</div>
            </div>
        </div>

        <div class="connexion-photo">
            <img th:src="@{/images/clapier-elevage.jpg}" alt="Élevage cunicole">
        </div>
    </aside>

    <main class="connexion-contenu">
        <div class="carte-connexion">
            <h1>Connexion</h1>

            <div th:if="${param.erreur}" class="message-erreur">
                Identifiants incorrects ou compte désactivé.
            </div>
            <div th:if="${param.deconnexion}" class="message-succes">
                Vous avez été déconnecté.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="champ">
                    <label for="username">Adresse de connexion</label>
                    <input type="text" id="username" name="username" placeholder="Adresse de connexion" required autofocus>
                </div>
                <div class="champ">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primaire" style="width: 100%; margin-top: 8px;">
                    Se connecter
                </button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
